[project]
name = "caste-in-common"
version = "0.1.0"
description = "Overlap and gaps in economic distributions across caste groups"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "matplotlib>=3.8", "pyarrow>=18"]

[project.optional-dependencies]
ihds = ["pyreadr>=0.5.6"]
dev = ["pytest>=8", "black", "isort", "flake8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.isort]
profile = "black"

[tool.black]
line-length = 88
target-version = ["py311"]
